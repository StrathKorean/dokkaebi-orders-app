name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk dokkaebi-orders.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dokkaebi-orders-apk
          path: dokkaebi-orders.apk

      # 완성된 APK 를 'apk' 브랜치에 올려 둡니다 (최신 파일 한 개만 유지).
      - name: Publish APK to apk branch
        run: |
          mkdir out && cp dokkaebi-orders.apk out/
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dokkaebi-orders.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
